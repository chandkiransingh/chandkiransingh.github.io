<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ask about Chand — AI Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Chat with an AI assistant that answers questions about Chand Kiran Singh's experience, skills and projects." />
    <meta name="theme-color" content="#0b0e14" />
    <link rel="icon" href="../images/avatar.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0b0e14;
        --bg-alt: #0f141d;
        --surface: #141a24;
        --border: #232c3b;
        --text: #e7edf5;
        --muted: #98a4b6;
        --faint: #6b7688;
        --accent: #ff5d5d;
        --accent-soft: rgba(255, 93, 93, 0.12);
        --ring: rgba(255, 93, 93, 0.35);
        --radius: 16px;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-alt);
      }
      header img { width: 38px; height: 38px; border-radius: 50%; }
      header .who { flex: 1; min-width: 0; }
      header h1 { font-size: 16px; margin: 0; font-weight: 600; }
      header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
      header a.back {
        color: var(--muted);
        text-decoration: none;
        font-size: 14px;
        border: 1px solid var(--border);
        padding: 6px 12px;
        border-radius: 999px;
      }
      header a.back:hover { color: var(--text); border-color: var(--accent); }
      .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); margin-right: 5px; }
      .status-dot.on { background: #3fb950; }
      main { flex: 1; overflow-y: auto; }
      .log { max-width: 760px; margin: 0 auto; padding: 24px 16px 8px; display: flex; flex-direction: column; gap: 14px; }
      .msg { max-width: 85%; padding: 11px 15px; border-radius: var(--radius); line-height: 1.55; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
      .msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
      .msg.bot a { color: var(--accent); }
      .msg.err { align-self: center; background: var(--accent-soft); color: var(--accent); font-size: 13px; }
      .typing::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--accent); }
      @keyframes blink { 50% { opacity: 0; } }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .chips button {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 7px 13px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .chips button:hover { color: var(--text); border-color: var(--accent); }
      form { border-top: 1px solid var(--border); background: var(--bg-alt); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
      .bar { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
      textarea {
        flex: 1;
        resize: none;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 11px 14px;
        font: inherit;
        font-size: 15px;
        max-height: 140px;
        outline: none;
      }
      textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
      button.send {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 0 18px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.send:disabled { opacity: 0.5; cursor: default; }
      .note { max-width: 760px; margin: 6px auto 0; font-size: 11px; color: var(--faint); text-align: center; }
    </style>
  </head>
  <body>
    <header>
      <img src="../images/avatar.png" alt="Chand Kiran Singh" />
      <div class="who">
        <h1>Ask about Chand</h1>
        <p><span class="status-dot" id="dot"></span><span id="status">Connecting…</span></p>
      </div>
      <a class="back" href="../">← Portfolio</a>
    </header>

    <main id="scroller">
      <div class="log" id="log">
        <div class="msg bot">Hi! I'm Chand's AI assistant. Ask me about his experience, skills, projects or how to reach him.</div>
        <div class="chips" id="chips">
          <button type="button">What does Chand do?</button>
          <button type="button">What are his main skills?</button>
          <button type="button">Tell me about his projects</button>
          <button type="button">How can I contact him?</button>
        </div>
      </div>
    </main>

    <form id="form">
      <div class="bar">
        <textarea id="input" rows="1" maxlength="600" placeholder="Ask anything about Chand…" aria-label="Your question"></textarea>
        <button class="send" id="send" type="submit">Send</button>
      </div>
      <p class="note">Answers are AI-generated from Chand's resume and may be imperfect. Runs on a self-hosted model.</p>
    </form>

    <script>
      const API_BASE = "https://chand-ai.taila34465.ts.net";

      const log = document.getElementById("log");
      const scroller = document.getElementById("scroller");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const send = document.getElementById("send");
      const chips = document.getElementById("chips");
      const history = [];
      let busy = false;

      function setStatus(online) {
        document.getElementById("dot").classList.toggle("on", online);
        document.getElementById("status").textContent = online ? "Online" : "Offline right now";
      }

      fetch(API_BASE + "/health").then(r => setStatus(r.ok)).catch(() => setStatus(false));

      function escapeHtml(s) {
        return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      function render(text) {
        return escapeHtml(text)
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/`([^`]+)`/g, "$1")
          .replace(/(https?:\/\/[^\s)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
          .replace(/([\w.+-]+@[\w-]+\.[\w.]+)/g, '<a href="mailto:$1">$1</a>');
      }

      function add(cls, html) {
        const el = document.createElement("div");
        el.className = "msg " + cls;
        el.innerHTML = html;
        log.appendChild(el);
        scroller.scrollTop = scroller.scrollHeight;
        return el;
      }

      async function ask(question) {
        if (busy || !question.trim()) return;
        busy = true;
        send.disabled = true;
        chips.remove();
        add("user", escapeHtml(question));
        history.push({ role: "user", content: question });
        const bot = add("bot typing", "");
        let answer = "";
        try {
          const res = await fetch(API_BASE + "/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: history.slice(-10) }),
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error || "Something went wrong.");
          }
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            answer += decoder.decode(value, { stream: true });
            bot.innerHTML = render(answer);
            scroller.scrollTop = scroller.scrollHeight;
          }
          history.push({ role: "assistant", content: answer });
          setStatus(true);
        } catch (e) {
          bot.remove();
          history.pop();
          add("err", escapeHtml(e.message === "Failed to fetch" ? "The assistant is offline right now. Please email chandkiransingh04@gmail.com." : e.message));
        } finally {
          bot.classList.remove("typing");
          busy = false;
          send.disabled = false;
          input.focus();
        }
      }

      form.addEventListener("submit", e => {
        e.preventDefault();
        const q = input.value;
        input.value = "";
        input.style.height = "auto";
        ask(q);
      });
      input.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });
      input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = input.scrollHeight + "px";
      });
      chips.addEventListener("click", e => {
        if (e.target.tagName === "BUTTON") ask(e.target.textContent);
      });
    </script>
  </body>
</html>
